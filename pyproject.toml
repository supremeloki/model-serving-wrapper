[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-wrapper"
version = "0.1.0"
description = "Model serving wrapper: input validation, prediction cache, warmup, A/B rollout."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kooroush Masoumi", email = "kooroushmasoumi@gmail.com" }]
keywords = ["serving", "inference", "ab-testing", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
